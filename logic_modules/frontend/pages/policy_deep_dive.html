<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Policy Deep Dive — Abdul for Senate</title>
  <script src="../js/gate.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/abdul-design-system.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #fcf4ed; margin: 0; }
    .tool-header { background: #121c50; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
    .tool-header .brand { font-weight: 800; font-size: 1.15rem; }
    .tool-header .brand em { color: #d21214; font-style: normal; }
    .tool-header a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .tool-header a:hover { color: #fff; }
    .tool-hero { background: #121c50; color: #fcf4ed; padding: 2.5rem 1.5rem 2rem; text-align: center; }
    .tool-hero h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
    .tool-hero p { opacity: 0.8; max-width: 500px; margin: 0 auto; font-size: 0.95rem; line-height: 1.5; }
    .tool-body { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }
    .output-card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
    .output-card h3 { font-size: 0.85rem; font-weight: 700; color: #121c50; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem; }
    .btn { font-size: 0.85rem !important; padding: 0.5em 1.15em 0.65em !important; border-radius: 8px !important; }

    /* ─── Interactive Policy Options ─── */
    .policy-options { display: grid; gap: 0.75rem; }
    .policy-option { background: #fff; border: 2px solid #e0d6cc; border-radius: 12px; padding: 1.25rem; cursor: pointer; text-align: left; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; font-family: inherit; width: 100%; }
    .policy-option:hover { border-color: #121c50; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .policy-option.active { border-color: #d21214; background: #fcf4ed; }
    .policy-option .opt-num { display: inline-block; background: #121c50; color: #fff; border-radius: 6px; font-size: 0.75rem; font-weight: 700; padding: 0.2em 0.6em; margin-right: 0.6rem; vertical-align: middle; }
    .policy-option .opt-title { font-weight: 700; color: #121c50; font-size: 1rem; vertical-align: middle; }
    .policy-option .opt-desc { color: #555; font-size: 0.85rem; line-height: 1.5; margin-top: 0.5rem; }
    .policy-result { background: #fcf4ed; border-radius: 10px; padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; min-height: 60px; color: #1c1d27; border: 2px solid #e0d6cc; margin-top: 1rem; }
    .policy-res-title { font-size: 0.85rem; font-weight: 700; color: #121c50; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.25rem 0 0.5rem; }
    @media (max-width: 600px) { .tool-hero h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
<header class="tool-header">
  <div class="brand">Abdul <em>for Senate</em></div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="translate-widget-container">
      <div id="google_translate_element"></div>
    </div>
    <div id="lang-selector-wrap"></div>
    <a href="../">← Back to Tools</a>
  </div>
</header>
<section class="tool-hero">
  <h1>📜 Policy Deep Dive</h1>
  <p>Long-form policy analysis: Medicare for All, Green New Deal, corporate finance reform, and more.</p>
</section>
<div class="tool-body">
  <div class="output-card">
    <h3>📜 Policy Analysis</h3>
    <p style="color:#888;font-size:0.9rem;margin:0 0 1rem;">Click any policy below to load its full analysis instantly.</p>

    <div class="policy-options" id="policy-options">
      <button class="policy-option" type="button" data-policy="1">
        <span class="opt-num">1</span><span class="opt-title">Medicare for All Framework</span>
        <div class="opt-desc">Comprehensive single-payer architecture. Fully guarantees dental, vision, and mental healthcare with zero cost-sharing at delivery.</div>
      </button>
      <button class="policy-option" type="button" data-policy="2">
        <span class="opt-num">2</span><span class="opt-title">Green New Deal Blueprint</span>
        <div class="opt-desc">Infrastructure grid targeting lead pipe replacement networks and zero-emission municipal logistics across Michigan.</div>
      </button>
      <button class="policy-option" type="button" data-policy="3">
        <span class="opt-num">3</span><span class="opt-title">Corporate Super PAC Bans</span>
        <div class="opt-desc">Absolute ban on individual executive shell entities and campaign asset packaging via corporate lobbyists.</div>
      </button>
      <button class="policy-option" type="button" data-policy="4">
        <span class="opt-num">4</span><span class="opt-title">NEW POLICY TITLE</span>
        <div class="opt-desc">Details about the new policy go here.</div>
      </button>
    </div>

    <div class="policy-res-title">📄 Analysis Output</div>
    <div class="policy-result" id="policy-result">Select a policy above to see its full analysis.</div>
  </div>

<script src="../js/modules.js"></script>
<script src="../js/main.js"></script>
<script src="../js/language-selector.js"></script>
<script>
  (function () {
    'use strict';

    var options = document.querySelectorAll('#policy-options .policy-option');
    var resultEl = document.getElementById('policy-result');

    options.forEach(function (opt) {
      opt.addEventListener('click', function () {
        options.forEach(function (o) { o.classList.remove('active'); });
        opt.classList.add('active');

        var policyVal = opt.getAttribute('data-policy');
        var params = { policy: policyVal };

        resultEl.textContent = 'Loading…';

        window.BottomlineModules.run('policy_deep_dive', params)
          .then(function (result) {
            resultEl.textContent = result;
          })
          .catch(function (err) {
            resultEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
          });
      });
    });
  })();
</script>

<!-- Google Translate Element Scripts -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'bn,ur,es,ar,hi,he,fa,it,pl,zh-CN,zh-TW,ja,ko',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }

  (function() {
    const observer = new MutationObserver(function(mutations) {
      if (typeof google !== 'undefined' && google.translate) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1) {
              google.translate.TranslateElement.reload();
            }
          });
        });
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
